name: Test 🧪

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Run tests 🦀
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # The storage layer runs on SQLite (self-hosted) and Postgres (cloud); the
    # suite runs once on each, and tests/schema_parity.rs compares their schemas
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: beacon_gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests (SQLite)
        run: cargo test
      - name: Run tests (Postgres)
        run: cargo test
        env:
          BEACON_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/beacon_gateway

  version-check:
    name: Version sync 📦
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check version sync
        run: |
          PKG_VERSION=$(jq -r '.version' package.json)
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$PKG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VERSION, Cargo.toml=$CARGO_VERSION"
            exit 1
          fi
          echo "Versions match: $PKG_VERSION"
